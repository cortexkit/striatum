[profile.default]
retries = 0
fail-fast = true
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "120s", terminate-after = 2, grace-period = "60s" }

# Hosted runners run generated writes, all orderings of admission facts, and
# conformance suites in parallel on fewer cores. Keep the early warning, but
# allow those tests more time to finish before treating them as hung.
[[profile.ci.overrides]]
filter = '''
    (package(=striatum-module) and (
        test(/::routing_v1_(conformance_kit_matches_served_checks|explicit_harness_needs_conformance_case|fork_of_undeclared_conformance_case)$/)
        | test(/::whole_writer::generated_request_groups_compare_all_state_after_every_real_step$/)
        | test(/::order_tests::every_(legacy_)?admission_fact_order_has_the_in_order_end_state$/)
    )) | (package(=striatum-store) and (
        test(=block_state::tests::the_route_state_snapshot_from_memory_equals_sql_over_generated_route_writes)
        | test(=block_storage::tests::registered_block_migration_opens_fresh_and_older_chains_without_leaving_its_function)
    ))
'''
slow-timeout = { period = "120s", terminate-after = 6, grace-period = "60s" }

[test-groups]
daemon = { max-threads = 8 }

[[profile.default.overrides]]
filter = 'package(=striatum-module) and binary(=it) and test(/^(both_modules_e2e|real_daemon_e2e)::/)'
test-group = "daemon"

# The quota integration test builds both sibling daemons before exercising them;
# a cold sibling build needs more time than an ordinary routing test.
[[profile.default.overrides]]
filter = 'package(=striatum-module) and binary(=it) and test(/^both_modules_e2e::/)'
slow-timeout = { period = "240s", terminate-after = 3, grace-period = "60s" }

# The block-table parity test replays the production fixture through both
# implementations; on a two- or three-core hosted CI runner it takes about three
# minutes, past the default limit.
[[profile.default.overrides]]
filter = 'package(=striatum-module) and test(=account_selection::block_parity_tests::blocks_parity_production_fixture)'
slow-timeout = { period = "240s", terminate-after = 3, grace-period = "60s" }

[package]
name = "prefrontal-routing-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure model-routing core for Alfonso: the saturating-adequacy quality gate + cost-primary objective scorer, the route-state types, and (next slice) the SQLite route-state store. Wire-agnostic: knows nothing about subc."

[dependencies]
prefrontal-core = { path = "../prefrontal-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# SHA-256 for the account allocator's Retry-After jitter (ported exactly from
# anthropic-auth) and the golden-vector fixture digest check.
sha2 = "0.10"

[package]
name = "prefrontal-routing-module"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "The prefrontal-routing subc module: registers a ManagementSurface, answers route.select over the subc wire by running the pure prefrontal-routing-core scorer against the model-facts seed (route-state store + module-to-module quota consumption land in later slices)."

[[bin]]
name = "ck-prefrontal-routing"
path = "src/main.rs"

[build-dependencies]
sha2 = "0.10"

[dependencies]
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "kv", "nkeys", "nuid", "ring", "server_2_10"] }
async-trait = "0.1"
base64 = "0.22"
cortexkit-bus-naming = "=0.2.7"
cortexkit-bus-nats = "0.3.0"
cortexkit-bus-trait = "0.3.0"
# The routing/v1 role contract: wire shapes and validators for the v1 ops.
cortexkit-role-routing = "0.2.0"
subc-client-rs = { workspace = true }
cortexkit-claustrum-client = { workspace = true }
prefrontal-routing-core = { path = "../prefrontal-routing-core" }
prefrontal-routing-store = { path = "../prefrontal-routing-store" }
prefrontal-core-store = { path = "../prefrontal-core-store" }
cortexkit-store-types = { workspace = true }
subc-protocol = { workspace = true }
subc-transport = { workspace = true }
subc-os = { workspace = true }
subc-jsonc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
schemars = "1"
sha2 = "0.10"
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
cortexkit-bus-inmemory = "0.3.0"
# Drives this module through every routing/v1 contract rule.
cortexkit-role-routing-conformance = "0.3.0"
prefrontal-routing-store = { path = "../prefrontal-routing-store", features = ["test-support"] }
prefrontal-test-support = { path = "../prefrontal-test-support" }
rusqlite = { version = "0.32", features = ["bundled"] }
# The real-daemon e2e tests spawn the daemon and module binaries; nothing else in
# this package's graph turns on tokio's process feature any more.
tokio = { workspace = true, features = ["process"] }

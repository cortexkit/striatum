[workspace]
resolver = "2"
members = [
    "crates/striatum-core",
    "crates/striatum-store",
    "crates/striatum-module",
]

# Line tables keep test backtraces useful without full debug-info link costs.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release-heapprof]
inherits = "release"
debug = 1
strip = false

[workspace.dependencies]
cortexkit-claustrum-client = "=0.7.3"
subc-protocol = "=0.37.0"
subc-transport = "=0.18.0"
subc-client-rs = "=0.40.0"
subc-os = "=0.1.37"
cortexkit-role-llm-runner = "=0.8.51"
cortexkit-role-routing = "=0.7.35"
cortexkit-role-classifier = "=0.6.0"
cortexkit-role-routing-conformance = "=0.10.40"
subc-jsonc = "0.1.1"
cortexkit-store = "=0.2.4"
cortexkit-store-types = "=0.2.2"
cortexkit-project-identity = "=0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
async-nats = { version = "0.50", default-features = false }
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
cortexkit-bus-inmemory = "0.3.0"
cortexkit-bus-client = "=0.1.4"
cortexkit-bus-naming = "=0.4.4"
cortexkit-bus-nats = "=0.5.0"
cortexkit-bus-trait = "0.3.0"
schemars = "1"
sha2 = "0.10"

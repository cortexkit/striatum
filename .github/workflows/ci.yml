name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - uses: taiki-e/install-action@cargo-nextest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the routing test gate
        run: bash scripts/rust-test-gate.sh

  windows-test:
    name: Test (windows)
    runs-on: windows-latest
    # A cold Windows build of the workspace and its tests takes far longer
    # than the Linux or macOS gate.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - uses: taiki-e/install-action@cargo-nextest

      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets

      # The gate script's source checks are platform-neutral and already run on
      # Linux and macOS; Windows runs the same test suite natively.
      - name: Run the routing tests
        run: cargo nextest run --locked --workspace --lib --bins --tests --no-fail-fast

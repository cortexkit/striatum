name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - uses: taiki-e/install-action@cargo-nextest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the routing test gate
        run: bash scripts/rust-test-gate.sh

  windows-check:
    name: Check (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets
